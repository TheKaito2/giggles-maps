<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Giggles Maps</title>
    <meta name="theme-color" content="#ffffff" />
    <!-- Appearance before the first paint (same key and rule as src/lib/theme.ts): a dark phone never flashes a light app -->
    <script>try{var a=localStorage.getItem("gm-appearance");document.documentElement.dataset.theme=a==="light"||a==="dark"?a:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
    <meta name="description" content="Tell Giggles Maps where you're going and how many extra minutes you have. It fills them with local stops across Thailand." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Giggles Maps" />
    <meta property="og:description" content="Extra time on your trip? Fill it with the best local stops in Thailand." />
    <meta property="og:image" content="https://giggles-maps.pages.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://xrlxfvwrkowaybtkkrdl.supabase.co" crossorigin />
    <link rel="preload" href="/fonts/LINESeedSansTH_A_Rg.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/LINESeedSansTH_A_Bd.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
